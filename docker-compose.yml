services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: always
    command: sh -c "php artisan reverb:start --host=0.0.0.0 --port=8081 --no-interaction & ./rr serve -c .rr.yaml & wait"
    volumes:
      - ./backend:/var/www
    ports:
      - "8002:8000"
      - "8081:8081"
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=svms
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - REDIS_HOST=redis
      - QUEUE_CONNECTION=redis
      - REVERB_HOST=0.0.0.0
      - REVERB_PORT=8081
      - OCTANE_SERVER=roadrunner
    depends_on:
      - mysql
      - redis
      
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: always
    command: php artisan queue:work --tries=3
    volumes:
      - ./backend:/var/www
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=svms
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - REDIS_HOST=redis
      - QUEUE_CONNECTION=redis
    depends_on:
      - mysql
      - redis
      
  mysql:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: svms
    volumes:
      - mysql_data:/var/lib/mysql
      
  redis:
    image: redis:alpine
    restart: always
    
  frontend:
    image: svms-dashboard:latest
    command:
      - node
      - build/server/index.js
    ports:
      - "8001:4000"
    environment:
      - PORT=4000
      - BACKEND_URL=http://app:8000
    restart: always
    depends_on:
      - app

volumes:
  mysql_data: null

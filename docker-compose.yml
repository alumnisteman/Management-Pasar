services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: always
    command: >
      sh -c "
        cd /var/www &&
        mkdir -p storage/framework/{views,cache/data,sessions} storage/logs &&
        chmod -R 777 storage &&
        php artisan octane:start --server=roadrunner --host=0.0.0.0 --port=8000 &&
        php artisan reverb:start --host=0.0.0.0 --port=8081 --no-interaction &&
        tail -f /dev/null"
    volumes:
      - ./storage:/var/www/storage
    ports:
      - "8081:8081"
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=svms
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - REDIS_HOST=redis
      - QUEUE_CONNECTION=redis
      - REVERB_HOST=0.0.0.0
      - REVERB_PORT=8081
      - OCTANE_SERVER=roadrunner
      - SCOUT_DRIVER=meilisearch
      - MEILISEARCH_HOST=http://meilisearch:7700
      - MEILISEARCH_KEY=svosMasterKey2026
    depends_on:
      - mysql
      - redis
      - meilisearch

  worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: always
    command: php artisan queue:work --tries=3
    volumes:
      - ./storage:/var/www/storage
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=svms
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - REDIS_HOST=redis
      - QUEUE_CONNECTION=redis
    depends_on:
      - mysql
      - redis

  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      - PORT=4000
      - BACKEND_URL=http://app:8000
    ports:
      - "4000:4000"
    depends_on:
      - app

  nginx:
    image: macbre/nginx-brotli:latest
    container_name: svms_nginx
    restart: always
    ports:
      - "8001:8001"
      - "8002:8002"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - app
      - frontend

  mysql:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: svms
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:alpine
    restart: always

  meilisearch:
    image: getmeili/meilisearch:latest
    restart: always
    environment:
      - MEILI_MASTER_KEY=svosMasterKey2026
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meilisearch_data:/meili_data
    ports:
      - "7701:7700"
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: svms_cadvisor
    restart: always
    ports:
      - "8082:8080"
    volumes:
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  prometheus:
    image: prom/prometheus:latest
    container_name: svms_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: svms_grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana

  webhook_receiver:
    build:
      context: ./webhook_receiver
      dockerfile: Dockerfile
    container_name: svms_webhook
    restart: always
    ports:
      - "9000:9000"
    environment:
      - REPO_PATH=/var/www/svms/management-pasar
    volumes:
      - ./webhook_receiver:/app
      - /var/www/svms/management-pasar:/var/www/svms/management-pasar
    depends_on:
      - app

volumes:
  mysql_data:
  meilisearch_data:
  prometheus_data:
  grafana_data:

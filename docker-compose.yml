services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: always
    command: sh -c "cd /var/www && mkdir -p storage/framework/views storage/framework/cache/data storage/framework/sessions storage/logs && chmod -R 777 storage && php /var/www/artisan octane:start --server=roadrunner --host=0.0.0.0 --port=8000 && php /var/www/artisan reverb:start --host=0.0.0.0 --port=8081 --no-interaction && tail -f /dev/null"
    volumes:
      - ./backend:/var/www
    ports:
      - "8081:8081"
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=svms
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - REDIS_HOST=redis
      - QUEUE_CONNECTION=redis
      - REVERB_HOST=0.0.0.0
      - REVERB_PORT=8081
      - OCTANE_SERVER=roadrunner
      - SCOUT_DRIVER=meilisearch
      - MEILISEARCH_HOST=http://meilisearch:7700
      - MEILISEARCH_KEY=svosMasterKey2026
    depends_on:
      - mysql
      - redis
      - meilisearch
      
  worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: always
    command: php artisan queue:work --tries=3
    volumes:
      - .:/var/www
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=svms
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - REDIS_HOST=redis
      - QUEUE_CONNECTION=redis
    depends_on:
      - mysql
      - redis
      
  mysql:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: svms
    volumes:
      - mysql_data:/var/lib/mysql
      
  redis:
    image: redis:alpine
    restart: always
    
  meilisearch:
    image: getmeili/meilisearch:latest
    restart: always
    environment:
      - MEILI_MASTER_KEY=svosMasterKey2026
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meilisearch_data:/meili_data
    ports:
      - "7701:7700"

  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      - PORT=4000
      - BACKEND_URL=http://app:8000
    volumes:
      - ./apps/web:/var/www
    depends_on:
      - app

  nginx:
    image: macbre/nginx-brotli:latest
    container_name: svms_nginx
    restart: always
    ports:
      - "8001:8001"
      - "8002:8002"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - app
      - frontend

volumes:
  mysql_data: null
  meilisearch_data: null

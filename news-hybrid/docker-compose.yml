services:
  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    ports:
      - "8005:8000"
    volumes:
      - ./app-backend:/var/www/html
    depends_on:
      - mysql
      - redis
    networks:
      news_hybrid_news_net:
        aliases:
          - news-hybrid-app-1

  mysql:
    image: mysql:8
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: news_hybrid
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  scraper:
    image: mcr.microsoft.com/playwright:v1.52.0
    volumes:
      - ./scraper:/scraper
    working_dir: /scraper
    command: node scraper.js

  worker:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    volumes:
      - ./app-backend:/var/www/html
    depends_on:
      - mysql
      - redis
    command: php artisan queue:work --tries=3 --timeout=90
    networks:
      - news_hybrid_news_net

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "8090:80"
    depends_on:
      - app
    networks:
      - news_hybrid_news_net

  meilisearch:
    image: getmeili/meilisearch:v1.12
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=masterKey
    volumes:
      - meili_data:/meili_data

volumes:
  mysql_data:
  redis_data:
  meili_data:

networks:
  news_hybrid_news_net:
    driver: bridge

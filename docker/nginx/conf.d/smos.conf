# SMOS Enterprise v6 Nginx Reverse Proxy Configuration

# Nginx DNS Resolver
resolver 127.0.0.11 valid=30s;

# 1. Frontend Server (React Router / Hono - PM2 on host:3000)
server {
    listen 8001;
    server_name localhost;

    brotli on;
    brotli_comp_level 6;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://172.21.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webp)$ {
        proxy_pass http://172.21.0.1:3000;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}

# 2. Backend Server (Laravel Octane RoadRunner API)
server {
    listen 8002;
    server_name localhost;

    brotli on;
    brotli_comp_level 6;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 50M;

    location / {
        set $upstream_app app;
        proxy_pass http://$upstream_app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120;
        proxy_connect_timeout 60;
        proxy_send_timeout 120;
    }
}
